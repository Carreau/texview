# Deploys the single-file UI to GitHub Pages. Served statically it
# runs in local mode: load .tex + review .json files in the browser,
# review/apply, download the results. Enable Pages ("GitHub Actions"
# source) in the repo settings once.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Stage site
        run: mkdir -p _site && cp texreview/static/index.html _site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
