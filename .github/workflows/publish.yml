# Publishes to PyPI on version tags (v0.2.0, ...) via trusted
# publishing — no API token in the repo. One-time setup on pypi.org:
# project "tex-review" -> Publishing -> add this repo + workflow
# (publish.yml, environment "pypi").
name: Publish

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: pipx run flit build
      - uses: pypa/gh-action-pypi-publish@release/v1
